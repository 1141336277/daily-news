<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>今日新闻 - 陈浩南</title>
<style>
:root{--bg:#f0f4f8;--card:#fff;--text:#1a1a2e;--sub:#8e8e93;--border:#e8ecf1;--green:#34c759;--shadow:0 2px 8px rgba(0,0,0,0.04)}
body.dark{--bg:#0f1117;--card:#161a24;--text:#e0e0e0;--sub:#888;--border:#1e2230;--shadow:0 2px 8px rgba(0,0,0,0.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);max-width:600px;margin:0 auto;min-height:100vh;transition:background 0.3s,color 0.3s}
.header{background:var(--card);padding:20px 16px 14px;box-shadow:var(--shadow);position:sticky;top:0;z-index:10}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.header h1{font-size:20px;font-weight:800}
.header-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:hover{background:var(--border)}
.header .info{font-size:11px;color:var(--sub)}
.search-box{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:20px;font-size:13px;outline:none;background:var(--bg);color:var(--text);margin-top:8px;display:none;font-family:inherit}
.search-box.show{display:block}
.search-box:focus{border-color:var(--green)}
.tabs{display:flex;gap:6px;padding:10px 16px;background:var(--card);border-top:1px solid var(--border);overflow-x:auto;position:sticky;top:100px;z-index:9}
.tab{flex-shrink:0;padding:7px 16px;border-radius:18px;font-size:13px;cursor:pointer;color:var(--sub);background:var(--bg);transition:all 0.2s;font-weight:500;border:none;font-family:inherit}
.tab.active{background:var(--text);color:var(--card)}
.news-list{padding:10px 14px 40px}
.news-card{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:15px;margin-bottom:8px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:all 0.2s;align-items:flex-start}
.news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.1);transform:translateY(-1px)}
.news-card:active{transform:scale(0.98)}
.news-img{width:80px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--border)}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;font-weight:600;line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-intro{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{font-size:10px;color:var(--sub);display:flex;align-items:center;gap:6px}
.news-meta .dot{width:4px;height:4px;border-radius:50%;background:var(--green)}
.footer{text-align:center;padding:20px;color:var(--sub);font-size:10px;line-height:1.8}
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.spinner{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.no-result{text-align:center;padding:40px 20px;color:var(--sub);font-size:14px}
@media(max-width:400px){.header h1{font-size:17px}.news-title{font-size:13px}}
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <h1>📰 今日新闻</h1>
    <div class="header-actions">
      <button class="icon-btn" id="search-toggle" onclick="toggleSearch()" title="搜索">🔍</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="暗色模式">🌙</button>
    </div>
  </div>
  <div class="info" id="header-info">加载中...</div>
  <input class="search-box" id="search-box" type="text" placeholder="搜索新闻标题..." oninput="doSearch()">
</div>
<div class="tabs" id="tabs"><button class="tab active" data-cat="hot">🔥 热点</button><button class="tab" data-cat="china">🇨🇳 国内</button><button class="tab" data-cat="finance">💰 财经</button></div>
<div class="news-list" id="news-list"><div class="loading"><div class="spinner"></div><br>正在加载新闻...</div></div>
<div class="footer">数据来源：新浪新闻 & 36氪 | 每小时自动更新<br>陈浩南 © 2026</div>

<script>
var newsData={},currentCat='hot',searchTerm='';
function toggleTheme(){var b=document.body,t=document.getElementById('theme-btn');if(b.classList.contains('dark')){b.classList.remove('dark');t.textContent='🌙';localStorage.setItem('news-theme','light')}else{b.classList.add('dark');t.textContent='☀️';localStorage.setItem('news-theme','dark')}}
function toggleSearch(){var s=document.getElementById('search-box');s.classList.toggle('show');if(s.classList.contains('show')){s.focus()}else{s.value='';searchTerm='';renderNews(currentCat)}}
function doSearch(){searchTerm=document.getElementById('search-box').value.trim().toLowerCase();renderNews(currentCat)}

async function loadNews(){
  try{var r=await fetch('news.json');if(!r.ok)throw new Error();var d=await r.json();newsData=d.news||{};var dt=new Date(d.updated);document.getElementById('header-info').textContent=dt.getFullYear()+'年'+(dt.getMonth()+1)+'月'+dt.getDate()+'日 星期'+['日','一','二','三','四','五','六'][dt.getDay()]+' · 陈浩南制作';renderNews(currentCat)}catch(e){document.getElementById('news-list').innerHTML='<div class="loading">⚠️ 加载失败<br><button onclick="loadNews()" style="margin-top:8px;padding:8px 16px;border-radius:14px;border:none;background:var(--text);color:var(--card);cursor:pointer;font-size:12px">重试</button></div>'}
}

function renderNews(cat){
  currentCat=cat;document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});var at=document.querySelector('[data-cat="'+cat+'"]');if(at)at.classList.add('active');
  var list=document.getElementById('news-list'),news=(newsData[cat]||[]).slice();
  if(searchTerm)news=news.filter(function(n){return n.title.toLowerCase().indexOf(searchTerm)!==-1||(n.intro||'').toLowerCase().indexOf(searchTerm)!==-1});
  if(news.length===0){list.innerHTML='<div class="no-result">'+(searchTerm?'没找到相关新闻':'暂无新闻')+'</div>';return}
  var h='';news.forEach(function(n,i){h+='<a class="news-card" href="'+esc(n.url)+'" target="_blank"><div class="news-body"><div class="news-title">'+esc(n.title)+'</div>'+(n.intro?'<div class="news-intro">'+esc(n.intro)+'</div>':'')+'<div class="news-meta"><span>'+esc(n.source)+'</span><span class="dot"></span><span>'+fmtTime(n.time)+'</span></div></div></a>'});list.innerHTML=h
}

function fmtTime(ts){if(!ts)return'';try{var d=/^\d+$/.test(String(ts))?new Date(parseInt(ts)*1000):new Date(ts);if(isNaN(d.getTime()))return'';var n=new Date(),diff=Math.floor((n-d)/60000);if(diff<60)return diff<=0?'刚刚':diff+'分钟前';var hr=Math.floor(diff/60);if(hr<24)return hr+'小时前';return(d.getMonth()+1)+'/'+d.getDate()}catch(e){return''}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

document.getElementById('tabs').addEventListener('click',function(e){if(e.target.classList.contains('tab'))renderNews(e.target.getAttribute('data-cat'))});

// 主题
(function(){if(localStorage.getItem('news-theme')==='dark'){document.body.classList.add('dark');document.getElementById('theme-btn').textContent='☀️'}})();
loadNews();
</script>
</body>
</html>
