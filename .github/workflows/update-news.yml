name: 自动更新新闻

on:
  schedule:
    # 每小时更新一次（UTC 时间）
    - cron: '0 * * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 抓取新闻
        run: node update-news.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "自动更新新闻 $(date +'%Y-%m-%d %H:%M')"
          git push
